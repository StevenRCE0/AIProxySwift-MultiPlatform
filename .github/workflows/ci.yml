name: CI

# Build AIProxy on Linux and macOS so the "MultiPlatform" promise stays true.
# Linux is the one that regresses (Apple-only APIs: OSLog, FoundationNetworking,
# URLSession.bytes, .avStreaming, AVFoundation). macOS is the reference.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Build AIProxy (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4
      - name: swift build (AIProxy target)
        run: |
          swift --version
          # AIProxyRealtime depends on AVFoundation (Apple-only), so on Linux build
          # only the cross-platform AIProxy library — which is what server-side
          # consumers (e.g. KeepTalking's daemon) actually link.
          swift build --target AIProxy

  macos:
    name: Build all (macOS)
    runs-on: macos-15
    steps:
      # macos-15's default Xcode is Swift 6.1; the package needs tools 6.2. Select
      # the newest Xcode on the image (Swift 6.2+).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
      - name: swift build
        run: |
          swift --version
          swift build
